<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bid Options Generator — DPD</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --navy:       #0F1F3D;
    --navy-mid:   #162548;
    --navy-light: #1E3260;
    --gold:       #C8A84B;
    --gold-light: #E2C46E;
    --white:      #F4F6FA;
    --muted:      #7A8FAD;
    --green:      #27AE60;
    --red:        #C0392B;
    --amber:      #E67E22;
    --card-bg:    #0D1A35;
    --border:     #1F3460;
    --radius:     6px;
    --font-mono:  'Courier New', monospace;
    --font-ui:    'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(160deg, #0F1F3D 0%, #0A1628 100%);
    color: var(--white);
    font-family: var(--font-ui);
    min-height: 100vh;
    padding: 0 0 60px 0;
  }
  header {
    background: var(--navy-mid);
    border-bottom: 2px solid var(--gold);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title { font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 0.04em; }
  .header-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .container { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 24px;
  }
  .card-title {
    font-size: 13px; font-weight: 700; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px;
  }
  .form-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  input[type="datetime-local"], input[type="text"], select {
    background: var(--navy-mid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--white);
    padding: 8px 12px;
    font-size: 14px;
    font-family: var(--font-ui);
    min-width: 160px;
  }
  input[type="datetime-local"]:focus, select:focus { outline: 1px solid var(--gold); }
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--gold); background: rgba(200,168,75,0.05); }
  .upload-zone .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-zone .upload-label { font-size: 14px; color: var(--muted); }
  .upload-zone .upload-label strong { color: var(--gold); }
  .upload-zone input[type="file"] { display: none; }
  .file-loaded {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: rgba(39,174,96,0.1); border: 1px solid var(--green);
    border-radius: var(--radius); font-size: 13px; color: var(--green);
  }
  .btn {
    padding: 9px 20px; border-radius: var(--radius); border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
    font-family: var(--font-ui); transition: background 0.15s;
  }
  .btn-primary  { background: var(--gold); color: var(--navy); }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary { background: var(--navy-light); color: var(--white); border: 1px solid var(--border); }
  .btn-secondary:hover { background: var(--border); }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #1e8449; }
  .status-bar {
    padding: 10px 16px; border-radius: var(--radius);
    font-size: 13px; margin-bottom: 16px; display: none;
  }
  .status-bar.info    { background: rgba(200,168,75,0.1); border: 1px solid var(--gold); color: var(--gold); display: block; }
  .status-bar.success { background: rgba(39,174,96,0.1);  border: 1px solid var(--green); color: var(--green); display: block; }
  .status-bar.error   { background: rgba(192,57,43,0.1);  border: 1px solid var(--red); color: var(--red); display: block; }

  /* Checkboxes for exclude */
  .check-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .check-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--navy-mid); border: 1px solid var(--border);
    border-radius: 20px; padding: 5px 12px;
    font-size: 12px; cursor: pointer; user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .check-pill input[type="checkbox"] { display: none; }
  .check-pill.checked {
    background: rgba(192,57,43,0.15);
    border-color: var(--red);
    color: var(--red);
  }
  .check-pill .pill-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .check-pill.checked .pill-dot { background: var(--red); }

  .results-section { display: none; }
  .results-section.visible { display: block; }
  .table-label {
    font-size: 15px; font-weight: 700; color: var(--gold);
    margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .options-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px; margin-bottom: 32px;
  }
  .options-table th {
    background: var(--navy-light); color: var(--gold);
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; padding: 10px 14px;
    text-align: left; border: 1px solid var(--border);
  }
  .options-table td {
    padding: 10px 14px; border: 1px solid var(--border);
    vertical-align: top; color: var(--white); line-height: 1.6;
  }
  .options-table tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
  .days-pill {
    display: inline-block; background: var(--navy-light);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 7px; font-size: 12px; margin: 2px; color: var(--white);
  }
  .none-label { color: var(--muted); font-style: italic; font-size: 12px; }
  .summary-bar {
    background: var(--navy-mid); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 16px;
    font-size: 12px; color: var(--muted); margin-bottom: 20px;
  }
  .summary-bar strong { color: var(--white); }
  .export-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
</style>
</head>
<body>

<header>
  <div>
    <div class="header-title">BID OPTIONS GENERATOR</div>
    <div class="header-sub">Dallas Police Department · Personnel Unit</div>
  </div>
</header>

<div class="container">

  <!-- Step 1: Upload -->
  <div class="card">
    <div class="card-title">Step 1 — Upload Bid Report</div>
    <div id="upload-zone" class="upload-zone"
         onclick="document.getElementById('file-input').click()"
         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)">
      <div class="upload-icon">📂</div>
      <div class="upload-label">
        <strong>Click to upload</strong> or drag and drop your bid report<br>
        Accepts CSV or Excel (.xlsx / .xls)
      </div>
      <input type="file" id="file-input" accept=".csv,.xlsx,.xls" onchange="handleFile(event)">
    </div>
    <div id="file-loaded" style="display:none; margin-top:12px"></div>
  </div>

  <!-- Step 2: Employee Details + Config -->
  <div class="card">
    <div class="card-title">Step 2 — Employee Details</div>
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="emp-first" placeholder="John" style="min-width:150px">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="emp-last" placeholder="Smith" style="min-width:150px">
      </div>
      <div class="form-group">
        <label>Badge Number</label>
        <input type="text" id="emp-badge" placeholder="12345" style="min-width:110px">
      </div>
      <div class="form-group">
        <label>Rank</label>
        <select id="rank-select">
          <option value="SGT">Sergeant (SGT)</option>
          <option value="SC">Senior Corporal (SC)</option>
          <option value="PO">Police Officer (PO)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Employee Bid Time</label>
        <input type="datetime-local" id="bid-time" step="60">
      </div>
    </div>

    <hr class="divider">
    <div class="card-title" style="margin-bottom:12px">Exclude from Output</div>

    <div class="form-row" style="align-items:flex-start">
      <div class="form-group">
        <label>Exclude Stations</label>
        <div class="check-group" id="station-checks">
          <!-- populated by JS -->
        </div>
      </div>
      <div class="form-group" style="margin-left:32px">
        <label>Exclude Watches</label>
        <div class="check-group" id="watch-checks">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <hr class="divider">
    <div>
      <button class="btn btn-primary" onclick="generate()">Generate Options</button>
    </div>
  </div>

  <div id="status-bar" class="status-bar"></div>

  <!-- Results -->
  <div id="results-section" class="results-section">
    <div class="export-row">
      <button class="btn btn-green" onclick="exportExcel()">⬇ Export to Excel</button>
      <button class="btn btn-secondary" onclick="clearResults()">✕ Clear</button>
    </div>
    <div id="summary-bar" class="summary-bar"></div>
    <div id="tables-container"></div>
  </div>

</div>

<script>
// ── CONSTANTS ─────────────────────────────────────────────────
const DIVISIONS = [
  'Central', 'Northeast', 'Southeast', 'Southwest',
  'Northwest', 'North Control', 'South Central', 'CBD'
];

const WATCHES = ['1', '2', '3'];
const WATCH_LABEL = { '1': '1st Watch', '2': '2nd Watch', '3': '3rd Watch' };

// Day numbers: 1=Sunday, 2=Monday, 3=Tuesday, 4=Wednesday,
//              5=Thursday, 6=Friday, 7=Saturday
const DAY_ABBR = { 1:'Su', 2:'M', 3:'T', 4:'W', 5:'Th', 6:'F', 7:'Sa' };

// Rank codes embedded in OppCode
const RANK_CODES = ['SGT', 'SC', 'PO', 'CPL'];

// Watch word → number
const WATCH_WORD = { 'ALPHA':'1', 'BRAVO':'2', 'CHARLIE':'3' };

// Division prefix → display name (2-letter for all except CBD)
const DIV_PREFIX = {
  'CBD': 'CBD',
  'NE':  'Northeast',
  'CE':  'Central',
  'SE':  'Southeast',
  'SW':  'Southwest',
  'NW':  'Northwest',
  'NC':  'North Control',
  'SC':  'South Central',
};

let rawData   = [];
let parsedRows = [];

// ── INIT CHECKBOXES ───────────────────────────────────────────
function initCheckboxes() {
  const stationEl = document.getElementById('station-checks');
  const watchEl   = document.getElementById('watch-checks');

  stationEl.innerHTML = DIVISIONS.map(d =>
    `<label class="check-pill" id="chk-div-${d.replace(/\s/g,'')}" onclick="togglePill(this)">
      <input type="checkbox" value="${d}">
      <span class="pill-dot"></span>${d}
    </label>`
  ).join('');

  watchEl.innerHTML = WATCHES.map(w =>
    `<label class="check-pill" id="chk-watch-${w}" onclick="togglePill(this)">
      <input type="checkbox" value="${w}">
      <span class="pill-dot"></span>${WATCH_LABEL[w]}
    </label>`
  ).join('');
}

function togglePill(label) {
  const cb = label.querySelector('input[type="checkbox"]');
  cb.checked = !cb.checked;
  label.classList.toggle('checked', cb.checked);
}

function getExcluded(groupId) {
  return [...document.querySelectorAll(`#${groupId} input[type="checkbox"]:checked`)]
    .map(cb => cb.value);
}

// ── FILE HANDLING ─────────────────────────────────────────────
function handleDragOver(e) { e.preventDefault(); document.getElementById('upload-zone').classList.add('drag-over'); }
function handleDragLeave()  { document.getElementById('upload-zone').classList.remove('drag-over'); }
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('upload-zone').classList.remove('drag-over');
  if (e.dataTransfer.files[0]) processFile(e.dataTransfer.files[0]);
}
function handleFile(e) { if (e.target.files[0]) processFile(e.target.files[0]); }

function processFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb   = XLSX.read(data, { type: 'array', cellDates: true });
      const ws   = wb.Sheets[wb.SheetNames[0]];
      // Get as array of arrays to handle the junk header rows
      const aoa  = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
      rawData = parseReport(aoa);
      showFileLoaded(file.name, rawData.length);
      setStatus(`Loaded ${rawData.length} data rows from ${file.name}.`, 'info');
    } catch(err) {
      setStatus('Error reading file: ' + err.message, 'error');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseReport(aoa) {
  // Find the header row — look for row containing 'textbox10' or 'oppcode'
  let headerRowIdx = -1;
  let colOppCode = -1, colSkill = -1, colBidTime = -1, colWatch = -1, colDaysOff = -1;

  for (let i = 0; i < Math.min(aoa.length, 10); i++) {
    const row = aoa[i].map(c => String(c).toLowerCase().trim());
    const oppIdx = row.findIndex(c => c === 'textbox10' || c.includes('oppcode') || c.includes('opp_code'));
    if (oppIdx >= 0) {
      headerRowIdx = i;
      colOppCode = oppIdx;
      // Find other columns
      row.forEach((c, idx) => {
        if (c === 'specialrequirements' || c.includes('skill') || c.includes('special')) colSkill = idx;
        if (c === 'textbox17' || c.includes('bidtime') || c.includes('bid_time') || c.includes('bid time')) colBidTime = idx;
        if (c === 'textbox20' || (c.includes('watch') && !c.includes('bid'))) colWatch = idx;
        if (c === 'textbox18' || c.includes('daysoff') || c.includes('days_off') || c.includes('days off')) colDaysOff = idx;
      });
      break;
    }
  }

  if (headerRowIdx < 0 || colOppCode < 0) {
    throw new Error('Could not find OppCode column (textbox10). Check file format.');
  }

  console.log('Header row:', headerRowIdx, '| OppCode col:', colOppCode, '| Skill col:', colSkill, '| BidTime col:', colBidTime, '| Watch col:', colWatch, '| DaysOff col:', colDaysOff);

  const rows = [];
  for (let i = headerRowIdx + 1; i < aoa.length; i++) {
    const row = aoa[i];
    const oppCode = String(row[colOppCode] || '').trim();
    if (!oppCode) continue;

    const parsed = parseOppCode(oppCode);
    if (!parsed) continue;

    // Bid time — empty = never picked = always available
    let bidTimeVal = null;
    if (colBidTime >= 0) {
      const raw = row[colBidTime];
      if (raw instanceof Date) bidTimeVal = raw;
      else if (raw && String(raw).trim()) {
        const d = new Date(String(raw).trim());
        if (!isNaN(d)) bidTimeVal = d;
      }
    }

    // Days off override from numeric column if available
    let daysOff = parsed.daysOff;
    if (colDaysOff >= 0 && row[colDaysOff]) {
      const numericDays = parseDaysOffNumeric(String(row[colDaysOff]));
      if (numericDays) daysOff = numericDays;
    }

    // Skill override from dedicated column
    let skill = parsed.skill;
    if (colSkill >= 0 && row[colSkill]) {
      const s = String(row[colSkill]).trim().toUpperCase();
      if (s === 'FTO' || s === 'RTO') skill = s;
    }

    // Watch override from dedicated column
    let watch = parsed.watch;
    if (colWatch >= 0 && row[colWatch]) {
      const w = String(row[colWatch]).trim();
      if (['1','2','3'].includes(w)) watch = w;
    }

    rows.push({
      oppCode,
      division: parsed.division,
      watch,
      daysOff,
      skill,
      bidTime: bidTimeVal,
    });
  }

  return rows;
}

// ── OPCODE PARSER ─────────────────────────────────────────────
// Format: [ID][ORG][DIV][RANK][WATCH][DAYSOFF][SECTOR][SKILL?]
// Example: 198 13 CBD SC Alpha TWL 130 RTO
//          1141 SW SC Charlie TFF 430 FTO
// The ID and ORG are numeric prefixes; we skip those.
function parseOppCode(code) {
  // Remove leading numbers and spaces (ID + ORG)
  // Find first alphabetic character
  const match = code.match(/^[\d\s]*(.*)/);
  if (!match) return null;
  let rest = match[1].trim();

  // Detect division
  let division = null;
  if (rest.startsWith('CBD')) {
    division = 'CBD';
    rest = rest.slice(3);
  } else {
    const div2 = rest.slice(0, 2).toUpperCase();
    if (DIV_PREFIX[div2]) {
      division = DIV_PREFIX[div2];
      rest = rest.slice(2);
    }
  }
  if (!division) return null;

  // Next: rank code (SGT, SC, PO, CPL) — skip it
  for (const rank of RANK_CODES) {
    if (rest.toUpperCase().startsWith(rank)) {
      rest = rest.slice(rank.length);
      break;
    }
  }

  // Next: watch word (Alpha, Bravo, Charlie)
  let watch = null;
  for (const [word, num] of Object.entries(WATCH_WORD)) {
    if (rest.toUpperCase().startsWith(word)) {
      watch = num;
      rest = rest.slice(word.length);
      break;
    }
  }
  if (!watch) return null;

  // Next: days off — 2 or 3 uppercase letters
  const daysMatch = rest.match(/^([A-Z]{2,3})/);
  if (!daysMatch) return null;
  const daysOff = expandDaysOff(daysMatch[1]);
  rest = rest.slice(daysMatch[1].length);

  // Remainder: sector number + optional skill
  let skill = null;
  if (rest.toUpperCase().includes('FTO')) skill = 'FTO';
  else if (rest.toUpperCase().includes('RTO')) skill = 'RTO';

  return { division, watch, daysOff, skill };
}

// Expand abbreviated days off to readable format
// Letters represent consecutive days; order is M T W Th F Sa Su
// The abbreviation uses first letter(s) of each day
function expandDaysOff(abbr) {
  // Map single/double letter codes to day names
  // We'll just return the abbr as-is for display — it's already readable
  // But normalize to consistent format
  return abbr.toUpperCase();
}

// Parse numeric days off "5,6,7" using 1=Sun,2=Mon,...7=Sat
function parseDaysOffNumeric(raw) {
  if (!raw || !raw.trim()) return null;
  const nums = raw.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n) && n >= 1 && n <= 7);
  if (!nums.length) return null;
  return nums.map(n => DAY_ABBR[n] || String(n)).join('');
}

// ── GENERATE ──────────────────────────────────────────────────
function generate() {
  if (!rawData.length) { setStatus('Please upload a bid report first.', 'error'); return; }

  const bidTimeStr = document.getElementById('bid-time').value;
  if (!bidTimeStr) { setStatus('Please enter the employee\'s bid time.', 'error'); return; }

  const bidTime = new Date(bidTimeStr);
  const rank    = document.getElementById('rank-select').value;

  const excludeDivs   = getExcluded('station-checks');
  const excludeWatches = getExcluded('watch-checks');

  // Filter rows: include if bidTime is empty (never picked) OR bidTime >= employee's bid time
  const qualified = rawData.filter(row => {
    if (row.bidTime !== null && row.bidTime < bidTime) return false;
    if (excludeDivs.includes(row.division)) return false;
    if (excludeWatches.includes(row.watch)) return false;
    return true;
  });

  if (!qualified.length) {
    setStatus('No qualifying bids found. Check your bid time or file.', 'error');
    return;
  }

  const container = document.getElementById('tables-container');
  container.innerHTML = '';

  if (rank === 'SC') {
    renderTable(qualified, 'FTO', excludeDivs, excludeWatches);
    renderTable(qualified, 'RTO', excludeDivs, excludeWatches);
  } else {
    renderTable(qualified, null, excludeDivs, excludeWatches);
  }

  // Summary
  const empFirst = document.getElementById('emp-first').value.trim();
  const empLast  = document.getElementById('emp-last').value.trim();
  const empBadge = document.getElementById('emp-badge').value.trim();
  const nameStr  = empLast && empFirst ? `<strong>${empLast}, ${empFirst}</strong>` : '';
  const badgeStr = empBadge ? ` · Badge <strong>#${empBadge}</strong>` : '';
  document.getElementById('summary-bar').innerHTML =
    `${nameStr}${badgeStr} · Bid time: <strong>${bidTime.toLocaleString()}</strong> · Rank: <strong>${rank}</strong> · Qualifying rows: <strong>${qualified.length}</strong> of <strong>${rawData.length}</strong>`;

  document.getElementById('results-section').classList.add('visible');
  setStatus(`Done — ${qualified.length} qualifying bids processed.`, 'success');
}

function renderTable(rows, skillFilter, excludeDivs, excludeWatches) {
  // Filter by skill
  let data = rows;
  if (skillFilter) {
    data = rows.filter(r => r.skill === skillFilter);
  } else {
    // For SGT/PO, exclude FTO/RTO rows if they don't apply
    // Include rows where skill is null/empty OR matches rank context
  }

  // Build grid
  const activeDivs   = DIVISIONS.filter(d => !excludeDivs.includes(d));
  const activeWatches = WATCHES.filter(w => !excludeWatches.includes(w));

  const grid = {};
  activeDivs.forEach(d => {
    grid[d] = {};
    activeWatches.forEach(w => grid[d][w] = new Set());
  });

  data.forEach(row => {
    if (!grid[row.division] || !grid[row.division][row.watch]) return;
    if (row.daysOff) grid[row.division][row.watch].add(row.daysOff);
  });

  const label = skillFilter ? `With ${skillFilter} Status` : 'Available Bid Options';
  const tableId = `tbl-${skillFilter || 'main'}`;

  let html = `<div class="table-label">${label}</div>`;
  html += `<table class="options-table" id="${tableId}">`;
  html += `<thead><tr><th>Patrol Division</th>`;
  activeWatches.forEach(w => html += `<th>${WATCH_LABEL[w]}</th>`);
  html += `</tr></thead><tbody>`;

  activeDivs.forEach(div => {
    html += `<tr><td><strong>${div}</strong></td>`;
    activeWatches.forEach(w => {
      const set = grid[div][w];
      if (!set || set.size === 0) {
        html += `<td><span class="none-label">None</span></td>`;
      } else {
        const pills = [...set].sort().map(d => `<span class="days-pill">${d}</span>`).join(' ');
        html += `<td>${pills}</td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table>`;
  document.getElementById('tables-container').innerHTML += html;
}

// ── EXPORT ────────────────────────────────────────────────────
function exportExcel() {
  const empFirst = document.getElementById('emp-first').value.trim();
  const empLast  = document.getElementById('emp-last').value.trim();
  const empBadge = document.getElementById('emp-badge').value.trim();
  const rank     = document.getElementById('rank-select').value;
  const bidTime  = new Date(document.getElementById('bid-time').value);

  const empName  = [empLast && empFirst ? `${empLast}, ${empFirst}` : (empLast || empFirst || 'Officer'),
                    empBadge ? `#${empBadge}` : ''].filter(Boolean).join(' ');
  const safeName = empName.replace(/[^a-zA-Z0-9\s#]/g,'').replace(/\s+/g,'_');

  const wb = XLSX.utils.book_new();

  if (rank === 'SC') {
    const ftoData = buildSheetData('tbl-FTO', 'With FTO Status');
    const rtoData = buildSheetData('tbl-RTO', 'With RTO Status');
    const maxRows = Math.max(ftoData.length, rtoData.length);

    const merged = [
      ['Bid Options Sheet', '', '', '', '', '', '', '', `Generated: ${new Date().toLocaleString()}`],
      [`Name: ${empName}`, '', '', '', '', '', '', '', `Bid Time: ${bidTime.toLocaleString()}`],
      [`Badge: ${empBadge ? '#'+empBadge : 'N/A'}`, '', '', '', '', '', '', '', `Rank: ${rank}`],
      [],
    ];
    for (let i = 0; i < maxRows; i++) {
      const left  = ftoData[i]  || Array(4).fill('');
      const right = rtoData[i]  || Array(4).fill('');
      merged.push([...left, '', ...right]);
    }
    const ws = XLSX.utils.aoa_to_sheet(merged);
    XLSX.utils.book_append_sheet(wb, ws, 'Bid Options');
  } else {
    const tableData = buildSheetData('tbl-main', 'Available Bid Options');
    const sheet = [
      ['Bid Options Sheet'],
      [`Name: ${empName}`, '', `Bid Time: ${bidTime.toLocaleString()}`],
      [`Badge: ${empBadge ? '#'+empBadge : 'N/A'}`, '', `Rank: ${rank}`],
      [`Generated: ${new Date().toLocaleString()}`],
      [],
      ...tableData,
    ];
    const ws = XLSX.utils.aoa_to_sheet(sheet);
    XLSX.utils.book_append_sheet(wb, ws, 'Bid Options');
  }

  XLSX.writeFile(wb, `BidOptions_${safeName}_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function buildSheetData(tableId, label) {
  const table = document.getElementById(tableId);
  if (!table) return [];
  const rows = [[label]];
  const headers = [...table.querySelectorAll('thead th')].map(th => th.textContent);
  rows.push(headers);
  table.querySelectorAll('tbody tr').forEach(tr => {
    const row = [...tr.querySelectorAll('td')].map(td => {
      const pills = td.querySelectorAll('.days-pill');
      if (pills.length) return [...pills].map(p => p.textContent).join(', ');
      return td.querySelector('.none-label') ? '' : td.textContent.trim();
    });
    rows.push(row);
  });
  return rows;
}

// ── UI HELPERS ────────────────────────────────────────────────
function showFileLoaded(name, count) {
  document.getElementById('upload-zone').style.display = 'none';
  const fl = document.getElementById('file-loaded');
  fl.style.display = 'flex';
  fl.innerHTML = `<div class="file-loaded">✓ ${name} — ${count} rows loaded &nbsp;
    <button class="btn btn-secondary" style="padding:4px 10px;font-size:11px" onclick="resetFile()">Change file</button></div>`;
}
function resetFile() {
  rawData = [];
  document.getElementById('upload-zone').style.display = 'block';
  document.getElementById('file-loaded').style.display = 'none';
  document.getElementById('file-input').value = '';
  clearResults();
}
function setStatus(msg, type) {
  const el = document.getElementById('status-bar');
  el.textContent = msg;
  el.className = `status-bar ${type}`;
}
function clearResults() {
  document.getElementById('results-section').classList.remove('visible');
  document.getElementById('tables-container').innerHTML = '';
  document.getElementById('status-bar').className = 'status-bar';
}

// ── BOOT ──────────────────────────────────────────────────────
initCheckboxes();
